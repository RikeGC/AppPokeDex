<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex FireRed</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #dc2626;
      --accent-dark: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 2rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      margin-bottom: 18px;
    }
    .search-row {
      display: grid;
      grid-template-columns: 1fr 170px 130px;
      gap: 10px;
    }
    input, select, button {
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 0 12px;
      font-size: 14px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: var(--accent-dark); }
    .quick-list {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      padding: 7px 12px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 12px;
    }
    .chip:hover { background: #f1f5f9; }
    .grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 18px;
    }
    .sprite-box {
      background: #f1f5f9;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 150px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      margin-right: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      background: #fff;
    }
    .info-box {
      margin-top: 14px;
      background: #f8fafc;
      border-radius: 14px;
      padding: 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .number {
      padding: 6px 10px;
      border-radius: 999px;
      background: #f1f5f9;
      font-size: 12px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
    }
    thead th {
      text-align: left;
      background: #f1f5f9;
      padding: 12px;
      font-size: 14px;
    }
    tbody td {
      padding: 12px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
    .muted { color: var(--muted); }
    .hidden { display: none; }
    .error {
      color: #b91c1c;
      font-weight: 600;
    }
    .footer {
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }
    @media (max-width: 760px) {
      .search-row { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pokédex FireRed</h1>
    <div class="subtitle">Consulte em qual nível um Pokémon aprende cada golpe em Pokémon FireRed / LeafGreen.</div>

    <div class="card">
      <div class="search-row">
        <input id="pokemonInput" placeholder="Ex.: Pikachu, Charizard, Bulbasaur" value="pikachu" />
        <select id="levelFilter">
          <option value="">Todos os níveis</option>
        </select>
        <button id="searchBtn">Buscar</button>
      </div>
      <div class="quick-list" id="quickList"></div>
      <div class="footer">Dica: pesquise por nome em inglês, como Pikachu, Charmander, Gengar, Mewtwo.</div>
    </div>

    <div class="card hidden" id="messageCard">
      <div id="messageText" class="muted"></div>
    </div>

    <div class="grid hidden" id="resultGrid">
      <div class="card">
        <div class="title-row">
          <strong id="pokemonName">Pikachu</strong>
          <span class="number" id="pokemonNumber">#025</span>
        </div>
        <div class="sprite-box">
          <img id="pokemonSprite" alt="sprite" width="140" height="140" />
        </div>
        <div id="typesBox"></div>
        <div class="info-box" id="infoText">
          Selecione um nível para ver apenas os golpes aprendidos naquele momento.
        </div>
      </div>

      <div class="card">
        <div class="title-row">
          <strong>Golpes por nível</strong>
          <span class="muted" id="countText"></span>
        </div>
        <table>
          <thead>
            <tr>
              <th style="width: 120px;">Nível</th>
              <th>Golpe</th>
            </tr>
          </thead>
          <tbody id="movesTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const quickPokemon = [
      'bulbasaur','ivysaur','venusaur','charmander','charmeleon','charizard',
      'squirtle','wartortle','blastoise','pikachu','raichu','eevee',
      'snorlax','gengar','lapras','dragonite','mewtwo','mew'
    ];

    const input = document.getElementById('pokemonInput');
    const levelFilter = document.getElementById('levelFilter');
    const searchBtn = document.getElementById('searchBtn');
    const quickList = document.getElementById('quickList');
    const messageCard = document.getElementById('messageCard');
    const messageText = document.getElementById('messageText');
    const resultGrid = document.getElementById('resultGrid');
    const pokemonName = document.getElementById('pokemonName');
    const pokemonNumber = document.getElementById('pokemonNumber');
    const pokemonSprite = document.getElementById('pokemonSprite');
    const typesBox = document.getElementById('typesBox');
    const infoText = document.getElementById('infoText');
    const movesTable = document.getElementById('movesTable');
    const countText = document.getElementById('countText');

    let currentMoves = [];

    function normalizePokemonName(value) {
      return value
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\./g, '')
        .replace(/\s+/g, '-')
        .replace("farfetch'd", 'farfetchd')
        .replace('mr mime', 'mr-mime')
        .replace('nidoran f', 'nidoran-f')
        .replace('nidoran m', 'nidoran-m');
    }

    function formatMoveName(name) {
      return name
        .split('-')
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(' ');
    }

    function formatPokemonName(name) {
      const special = {
        'nidoran-f': 'Nidoran♀',
        'nidoran-m': 'Nidoran♂',
        'mr-mime': 'Mr. Mime',
        'farfetchd': "Farfetch'd",
      };
      if (special[name]) return special[name];
      return name
        .split('-')
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(' ');
    }

    function showMessage(text, isError = false) {
      messageCard.classList.remove('hidden');
      messageText.textContent = text;
      messageText.className = isError ? 'error' : 'muted';
    }

    function hideMessage() {
      messageCard.classList.add('hidden');
    }

    function populateQuickList() {
      quickList.innerHTML = '';
      quickPokemon.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = formatPokemonName(name);
        btn.addEventListener('click', () => {
          input.value = formatPokemonName(name);
          searchPokemon(name);
        });
        quickList.appendChild(btn);
      });
    }

    function populateLevelFilter(moves) {
      const levels = [...new Set(moves.map(m => m.level))];
      levelFilter.innerHTML = '<option value="">Todos os níveis</option>';
      levels.forEach(level => {
        const option = document.createElement('option');
        option.value = String(level);
        option.textContent = `Nível ${level}`;
        levelFilter.appendChild(option);
      });
    }

    function renderMoves() {
      const selected = levelFilter.value;
      const filtered = selected === ''
        ? currentMoves
        : currentMoves.filter(m => m.level === Number(selected));

      movesTable.innerHTML = '';
      countText.textContent = `${filtered.length} golpe(s)`;
      infoText.textContent = selected === ''
        ? 'Selecione um nível para ver apenas os golpes aprendidos naquele momento.'
        : `Mostrando apenas os golpes aprendidos no nível ${selected}.`;

      if (filtered.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="2" class="muted">Nenhum golpe encontrado para esse filtro.</td>';
        movesTable.appendChild(tr);
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><strong>${item.level}</strong></td><td>${formatMoveName(item.move)}</td>`;
        movesTable.appendChild(tr);
      });
    }

    async function searchPokemon(name) {
      const normalized = normalizePokemonName(name);
      if (!normalized) return;

      hideMessage();
      resultGrid.classList.add('hidden');
      showMessage('Consultando learnset...');

      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${normalized}`);
        if (!response.ok) {
          throw new Error('Pokémon não encontrado.');
        }

        const data = await response.json();

        const moves = data.moves
          .flatMap(entry => {
            const details = entry.version_group_details.filter(detail =>
              detail.version_group.name === 'firered-leafgreen' &&
              detail.move_learn_method.name === 'level-up'
            );

            return details.map(detail => ({
              level: detail.level_learned_at,
              move: entry.move.name
            }));
          })
          .sort((a, b) => a.level - b.level || a.move.localeCompare(b.move));

        const seen = new Set();
        currentMoves = moves.filter(item => {
          const key = `${item.level}-${item.move}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });

        pokemonName.textContent = formatPokemonName(data.name);
        pokemonNumber.textContent = `#${String(data.id).padStart(3, '0')}`;
        pokemonSprite.src = data.sprites.front_default || '';
        pokemonSprite.alt = data.name;

        typesBox.innerHTML = '';
        data.types.forEach(t => {
          const span = document.createElement('span');
          span.className = 'badge';
          span.textContent = formatPokemonName(t.type.name);
          typesBox.appendChild(span);
        });

        populateLevelFilter(currentMoves);
        levelFilter.value = '';
        renderMoves();
        resultGrid.classList.remove('hidden');
        hideMessage();
      } catch (error) {
        showMessage(error.message || 'Erro ao consultar a Pokédex.', true);
      }
    }

    searchBtn.addEventListener('click', () => searchPokemon(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchPokemon(input.value);
    });
    levelFilter.addEventListener('change', renderMoves);

    populateQuickList();
    searchPokemon('pikachu');
  </script>
</body>
</html>
